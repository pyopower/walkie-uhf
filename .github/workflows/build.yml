# Compila el APK en cada cambio y, al subir una etiqueta vX.Y.Z, publica una release con el APK firmado.
name: Compilar APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: NDK 25 (el último que compila para Android 4.4) y CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "cmake;3.22.1" > /dev/null

      - name: Clave de firma (solo si el repo tiene los secretos)
        env:
          KEYSTORE_B64: ${{ secrets.WALKIE_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/walkie.jks"
          echo "WALKIE_STORE_FILE=$RUNNER_TEMP/walkie.jks" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          WALKIE_STORE_PASSWORD: ${{ secrets.WALKIE_STORE_PASSWORD }}
          WALKIE_KEY_ALIAS: ${{ secrets.WALKIE_KEY_ALIAS }}
          WALKIE_KEY_PASSWORD: ${{ secrets.WALKIE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$WALKIE_STORE_FILE" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/*/*.apk "out/WalkieUHF-$VER.apk"
          # copia con nombre fijo: .../releases/latest/download/WalkieUHF.apk da siempre la última
          cp "out/WalkieUHF-$VER.apk" out/WalkieUHF.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: WalkieUHF-apk
          path: out/*.apk

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') && env.WALKIE_STORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
